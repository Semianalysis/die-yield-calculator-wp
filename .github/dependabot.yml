# Groups Dependabot output into a few reviewable PRs per repo.
# Added 2026-08-04: this repo had no dependabot.yml, so security updates
# were arriving as one ungrouped PR per alert.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
